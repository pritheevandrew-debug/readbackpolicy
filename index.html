<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read-Back Policy Quiz</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--muted:#5d6b7a;--accent:#0b6e8a;--ok:#1b8a4b;--bad:#c0392b;--line:#d9e0e7}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
  h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:16px}
  label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:1rem}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:1rem;cursor:pointer}
  button.secondary{background:#e8edf2;color:var(--ink)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
  .progress{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px}
  .progress div{height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
  .q{font-size:1.1rem;font-weight:600;margin-bottom:12px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent);background:#e8f4f8}
  .opt input{width:auto;margin-top:3px}
  .res{border-left:4px solid var(--line);padding:10px 12px;margin-bottom:12px;background:#fafbfc;border-radius:0 8px 8px 0}
  .res.ok{border-color:var(--ok)}.res.bad{border-color:var(--bad)}
  .res small{color:var(--muted);display:block;margin-top:4px}
  .score{font-size:2rem;font-weight:700}
  .hidden{display:none}
  @media print{
    @page{size:A4;margin:14mm}
    body{background:#fff}.no-print{display:none!important}
    .card{border:0;padding:0}.res{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Start screen -->
  <div id="start" class="card">
    <h1>Read-Back Policy Quiz</h1>
    <div class="sub">Verbal Order (Read Back) Policy · 10 questions</div>
    <label for="ward">Ward</label>
    <select id="ward">
      <option value="">Select ward</option>
      <option>PHDU</option>
    </select>
    <label for="staffId">ID number</label>
    <select id="staffId"><option value="">Select ID number</option></select>
    <div class="sub" id="staffName" style="margin-top:10px">Staff Name will show here.</div>
    <div class="row"><span></span><button id="startBtn">Start quiz</button></div>
  </div>

  <!-- Quiz screen -->
  <div id="quiz" class="card hidden">
    <div class="progress"><div id="bar"></div></div>
    <div class="sub" id="counter"></div>
    <div class="q" id="qText"></div>
    <div id="opts"></div>
    <div class="row">
      <button class="secondary" id="backBtn">Back</button>
      <button id="nextBtn">Next</button>
      <button id="submitBtn" class="hidden">Submit</button>
    </div>
  </div>

  <!-- Result screen -->
  <div id="result" class="hidden">
    <div class="card">
      <h1>Read-Back Policy Quiz – Result</h1>
      <div class="sub" id="who"></div>
      <div class="score" id="score"></div>
      <div class="sub" id="date"></div>
      <div class="sub no-print" id="sheetStatus"></div>
      <div class="no-print row" style="justify-content:flex-start">
        <button id="printBtn">Print A4 sheet / Save as PDF</button>
        <button class="secondary" id="againBtn">Retake</button>
      </div>
      <div class="sub no-print" style="margin-top:8px">In the print window, choose “Save as PDF” as the printer and paper size A4.</div>
    </div>
    <div id="review"></div>
  </div>

</div>

<script>
// ---- Edit or add questions here. `a` = index of the correct option (0-based). ----
const QUESTIONS = [
  {q:"According to the policy, verbal orders are defined as:",
   o:["Any order given by a physician, in any situation","Emergent or urgent face-to-face or telephone orders only","Orders written by hand and signed later","Routine daily orders communicated by the charge nurse"],
   a:1,e:"Verbal orders are emergent or urgent face-to-face or telephone orders only."},
  {q:"In general, how must orders be written, and when should verbal/telephone orders be used?",
   o:["Orally; written orders only for emergencies","Electronically; verbal and telephone orders in emergency situations only","Electronically; verbal orders whenever the physician is busy","On paper; verbal orders for any urgent request"],
   a:1,e:"Orders must generally be written electronically. Verbal and telephone orders are for emergency situations only."},
  {q:"What must be confirmed before a verbal or telephone order from an authorized provider is accepted?",
   o:["The patient's identification using two identifiers","The patient's insurance status","The patient's consent in writing","The ward manager's approval"],
   a:0,e:"Patient identification must be confirmed using two identifiers."},
  {q:"Within what time must a verbal order be entered in the Al Shifa system?",
   o:["Within 24 hours","Within the shift and a maximum of six hours post order","Before the next physician round","Within 12 hours"],
   a:1,e:"The order is entered within the shift and a maximum of 6 hours post order, stating it was given verbally."},
  {q:"What must the healthcare professional do after receiving a verbal order?",
   o:["Administer it immediately without further checks","Read back the details to the physician to confirm it was accurately understood","Ask a colleague to witness it the next day","Wait for the pharmacist to call back"],
   a:1,e:"Read-back is required, even if the receiver is confident they heard the order correctly."},
  {q:"For a medication verbal order, what should the prescriber do for unfamiliar drugs?",
   o:["Write the name on a sticky note","Repeat the name twice","Spell the name of the drug","Give only the brand name"],
   a:2,e:"The prescriber should spell the name of any unfamiliar drugs."},
  {q:"Which of the following is listed as an emergency in which verbal orders may be given?",
   o:["Routine medication refill","Discharge planning","Cardiac arrest","Dietary preference change"],
   a:2,e:"Listed emergencies include cardiac arrest, arrhythmias, hemorrhage, impending coma, impending shock, respiratory distress, seizures, shock, and delivery room mother/fetal distress."},
  {q:"Verbal or telephone orders CANNOT be given for which of the following?",
   o:["Oxygen therapy in respiratory distress","Chemotherapy medications","Cardiac arrest management","Seizure management"],
   a:1,e:"Not allowed for chemotherapy medications (also abortion- or labor-inducing medications, and patients with documented CKD or acute renal failure)."},
  {q:"Blood or blood products may be ordered verbally only in which situation?",
   o:["In theatre or ED under emergency situations, e.g. the Massive Transfusion Protocol","On the ward during night shifts","Whenever the physician is off-site","Never, under any circumstances"],
   a:0,e:"Verbal orders for blood/blood products may occur in theatre or ED under emergency situations only."},
  {q:"Which statement about the nurse's responsibility is correct?",
   o:["The nurse should skip read-back if confident they heard the order correctly","The nurse must ensure a valid, complete order exists before administering prescriptive medications or implementing a treatment","The nurse may use judgment to complete an incomplete order","The nurse is not responsible for clarifying the appropriateness of an order"],
   a:1,e:"A valid, complete order is required first. Read-back is needed even if confident, and the nurse seeks clarification from the prescriber when needed."}
];

// ---- Staff list (Paediatric HDU roster). Names cut off on the roster are shown as seen; edit here to complete them. ----
const STAFF = [
  ["73290","SAMAH HAMED SULAIMAN AL Y…"],
  ["67036","IBTIHAJ SAID AYIL AL HASNI"],
  ["67565","LIGI SARA ZACHARIA"],
  ["77998","FATMA NASSER ALI AL MAHRIZ"],
  ["82549","ANUMOL UNNI"],
  ["84353","LITTY JOSEPH"],
  ["84457","RENJITH JANET MERCYBAI"],
  ["84982","SAUMINI VALSALA"],
  ["46781","RINSY SHAJU"],
  ["59079","ROMALYN SOLIVEN CAOILE"],
  ["59328","NOBIN ELSAMMA JOSEPH"],
  ["82534","MIDHUL MICHAEL VINU"],
  ["84908","JOSMY THAZHAKKEL CHACKO"],
  ["88082","JILSY THOMAS"],
  ["90618","REKHA KANJIRA VILAYIL"],
  ["94210","MANJU MOHAN"],
  ["62113","DIONEVIE EBRON MONGCAL"],
  ["78124","SHINO PAUL"],
  ["82509","MARIAMMA THOMAS"],
  ["82532","SALINI PUTHIYAKUNNEL SALIMI…"],
  ["84461","NISMI KURIAN"],
  ["86933","OMNIA SALIM AMER AL MASROU…"],
  ["92466","CHINCHU RANI VINU"],
  ["26964","KOCHURANI THOMAS"],
  ["61817","MARIAN TARIAGA BAYARAS"],
  ["76288","AIDA MAHMOOD MOOSA AL BAL…"],
  ["84226","GLADIS BEULA PALMAR"],
  ["84714","BEEYAMOL KURIAKOSE"],
  ["86946","ARUB KHALFAN SAID AL RASHD…"],
  ["90749","FEMY JOSEPH"],
  ["77967","FATEMA ALI JUMA AL QARTUBI"],
  ["78726","TINTU JOSE KUTTIYIL"],
  ["82487","JUBY STANLY"],
  ["82506","DHANYA JOSEPH"],
  ["82522","LINCY MOL JOY KUTTY"],
  ["84871","LINCY BABU"],
  ["91682","SUAAD MAKTOUM OBAID AL JAE…"],
  ["77604","ASMA MARHOUN THUNAI AL MA…"],
  ["73274","IBTISAM YAOOQB MOHSIN AL Q…"]
];

const $ = id => document.getElementById(id);
let idx = 0, answers = [];
const L = "ABCD";

STAFF.sort((a,b) => Number(a[0]) - Number(b[0]));
STAFF.forEach(([id,name]) => {
  const o = document.createElement("option");
  o.value = id; o.textContent = id;
  $("staffId").appendChild(o);
});
$("staffId").onchange = () => {
  const s = STAFF.find(x => x[0] === $("staffId").value);
  $("staffName").textContent = s ? s[1] : "Staff Name will show here.";
};
const staffNameOf = () => (STAFF.find(x => x[0] === $("staffId").value) || ["",""])[1];

function show(id){ ["start","quiz","result"].forEach(s => $(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); }

$("startBtn").onclick = () => {
  if(!$("ward").value || !$("staffId").value){
    alert("Please select ward and ID number."); return;
  }
  idx = 0; answers = Array(QUESTIONS.length).fill(null); show("quiz"); render();
};

function render(){
  const q = QUESTIONS[idx];
  $("counter").textContent = `Question ${idx+1} of ${QUESTIONS.length}`;
  $("bar").style.width = ((idx+1)/QUESTIONS.length*100) + "%";
  $("qText").textContent = q.q;
  $("opts").innerHTML = "";
  q.o.forEach((t,i) => {
    const d = document.createElement("label");
    d.className = "opt" + (answers[idx]===i ? " sel" : "");
    d.innerHTML = `<input type="radio" name="o" ${answers[idx]===i?"checked":""}><span><b>${L[i]}.</b> </span>`;
    d.querySelector("span").appendChild(document.createTextNode(t));
    d.onclick = () => { answers[idx]=i; render(); };
    $("opts").appendChild(d);
  });
  $("backBtn").disabled = idx===0;
  const last = idx===QUESTIONS.length-1;
  $("nextBtn").classList.toggle("hidden", last);
  $("submitBtn").classList.toggle("hidden", !last);
  $("nextBtn").disabled = $("submitBtn").disabled = answers[idx]===null;
}
$("backBtn").onclick = () => { idx--; render(); };
$("nextBtn").onclick = () => { idx++; render(); };
$("submitBtn").onclick = () => {
  let s = 0; QUESTIONS.forEach((q,i)=>{ if(answers[i]===q.a) s++; });
  const pct = Math.round(s/QUESTIONS.length*100);
  $("who").textContent = `${staffNameOf()} · ID ${$("staffId").value} · Ward ${$("ward").value}`;
  $("score").textContent = `${s} / ${QUESTIONS.length} (${pct}%)`;
  $("date").textContent = new Date().toLocaleString();
  $("review").innerHTML = "";
  QUESTIONS.forEach((q,i)=>{
    const ok = answers[i]===q.a;
    const d = document.createElement("div");
    d.className = "card res " + (ok?"ok":"bad");
    d.innerHTML = `<b></b><div></div><div></div><small></small>`;
    const [b,y,c,sm] = d.children;
    b.textContent = `${i+1}. ${q.q}`;
    y.textContent = `Your answer: ${answers[i]===null?"—":L[answers[i]]+". "+q.o[answers[i]]} ${ok?"✔":"✘"}`;
    c.textContent = ok ? "" : `Correct answer: ${L[q.a]}. ${q.o[q.a]}`;
    sm.textContent = q.e;
    $("review").appendChild(d);
  });
  show("result");
  sendToSheet({
    timestamp: new Date().toLocaleString(),
    ward: $("ward").value,
    id: $("staffId").value,
    name: staffNameOf(),
    score: s,
    total: QUESTIONS.length,
    percent: pct,
    answers: answers.map(a => a===null ? "-" : L[a]).join(",")
  });
};

// Paste your Google Apps Script Web App URL here (see google-sheet-setup.gs)
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzDMuK5rCmMf8Xaf9TLqryfn6Rqm1TT9dGnoY_1KQF0CO_aHBaFuej5i-c5s1p05PB0Tw/exec";

function sendToSheet(data){
  const st = $("sheetStatus");
  if(!SHEET_URL){ st.textContent = "Google Sheet not connected yet (SHEET_URL is empty)."; return; }
  st.textContent = "Saving to Google Sheet…";
  fetch(SHEET_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(data)})
    .then(() => { st.textContent = "Result saved to Google Sheet ✔"; })
    .catch(() => { st.textContent = "Could not save to Google Sheet. Check internet and try again."; });
}
$("printBtn").onclick = () => window.print();
$("againBtn").onclick = () => show("start");
</script>
</body>
</html>
